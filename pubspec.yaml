name: bluetooth_manager
description: A simple plugin to manage Bluetooth, turning on and off and getting Bluetooth state.
version: 2.0.1
homepage: https://github.com/FabioClem/bluetooth_manager

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  permission_handler: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.2

flutter:
  plugin:
    platforms:
      android:
        package: com.fahen.bluetooth_manager
        pluginClass: BluetoothManagerPlugin
      ios:
        pluginClass: BluetoothManagerPlugin
      macos:
        pluginClass: BluetoothManagerPlugin
